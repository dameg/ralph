name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.9"

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.0"
          args: check --output-format=github

      - name: Compile and test
        run: |
          python -m compileall -q ralph_loop scripts tests
          python -m unittest discover -s tests -v

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(python -c 'from ralph_loop import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"

      - name: Build and verify executable
        run: |
          python scripts/build_zipapp.py
          ./dist/ralph --version
          cd dist
          sha256sum ralph > ralph.sha256
          cp ../install.sh install.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/ralph \
            dist/ralph.sha256 \
            dist/install.sh \
            --verify-tag \
            --generate-notes \
            --title "Ralph ${{ github.ref_name }}"
